<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Dominion">
<meta name="theme-color" content="#1a1d14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>IRON DOMINION — Mobile RTS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="topbar">
  <span id="money">$0</span>
  <span id="power">⚡ 0/0</span>
  <button id="rankBtn" class="ibtn">⭐1</button>
  <button id="speedBtn" class="ibtn" style="margin-left:auto;min-width:32px">1×</button>
  <button id="muteBtn" class="ibtn">🔊</button>
  <button id="menuBtn" class="ibtn">☰</button>
</div>
<div id="powers"></div>
<canvas id="mini" width="168" height="112"></canvas>
<button id="dozBtn" title="Cycle dozers">🚜</button>
<button id="selBtn" title="Box select">⬚</button>
<button id="armyBtn">⚔ ARMY</button>
<div id="card"></div>
<div id="toasts"></div>
<div id="overlay"></div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<script src="js/audio.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/helpers.js"></script>
<script src="js/world.js"></script>
<script src="js/units.js"></script>
<script src="js/buildings.js"></script>
<script src="js/projectiles.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/campaign.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
